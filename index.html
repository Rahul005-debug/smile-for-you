<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smile for me 💻❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts"></div>

  <div class="card">
    <h1>Hey, my favorite human ❤️</h1>
    <p>
      I heard today was tough, and your parents scolded you.<br>
      But to me, you are still the most amazing person in this universe.
    </p>

    <button id="btn">Click me 😊</button>

    <p id="secret" class="hidden">
      Error 404: Sadness not found.<br>
      System status: <span class="ok">You are loved, valued, and never alone.</span><br>
      From one CS nerd to my favorite girl: <strong>I’m always with you.</strong> 💖
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
